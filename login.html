<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 350px;
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            box-sizing: border-box;
            transition: 0.3s;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            padding-right: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .link:hover {
            color: #38bdf8;
        }
        .general-error {
            color: #ef4444;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <div class="error-msg" id="email-error"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <div class="error-msg" id="password-error"></div>
            </div>
            
            <div class="general-error" id="general-error"></div>
            
            <button type="submit">دخول</button>
        </form>
        
        <a href="index.html" class="link">ليس لديك حساب؟ إنشاء حساب جديد</a>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            // إخفاء رسائل الخطأ القديمة
            document.querySelectorAll(".error-msg").forEach(msg => msg.style.display = 'none');
            document.getElementById("general-error").style.display = 'none';
            
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            
            try {
                // إرسال البيانات للسيرفر المحلي الخاص بك
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // التعديل السحري المنتظر: التوجيه فوراً للوحة التحكم C1
                    window.location.href = "C1.html";
                } else {
                    // عرض الأخطاء لو البيانات غلط
                    if (data.errors) {
                        for (const key in data.errors) {
                            const errorDiv = document.getElementById(`${key}-error`);
                            if (errorDiv) {
                                errorDiv.innerText = data.errors[key];
                                errorDiv.style.display = 'block';
                            }
                        }
                    } else if (data.message) {
                        const genError = document.getElementById("general-error");
                        genError.innerText = data.message;
                        genError.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error("Error:", error);
                const genError = document.getElementById("general-error");
                genError.innerText = "حدث خطأ في الاتصال بالسيرفر، تأكد من تشغيل السيرفر.";
                genError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
