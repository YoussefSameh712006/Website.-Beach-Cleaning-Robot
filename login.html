<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 380px; border: 1px solid #e1e4e8; }
        h2 { text-align: center; color: #2d3748; margin-bottom: 25px; font-weight: 600; }
        
        .input-group { margin-bottom: 15px; position: relative; }
        input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; transition: 0.2s; font-size: 14px; margin: 0; }
        input:focus { border-color: #3182ce; outline: none; }
        
        /* رسائل الخطأ باللون الأحمر أسفل كل خانة بوضوح */
        .error-msg { color: #e53e3e; font-size: 12px; margin-top: 5px; display: none; font-weight: 500; padding-right: 5px; }
        
        /* تنسيق خانة "ذكرني" */
        .remember-container { display: flex; align-items: center; margin-bottom: 15px; cursor: pointer; user-select: none; }
        .remember-container input { width: auto; margin-left: 8px; cursor: pointer; accent-color: #3182ce; width: 16px; height: 16px; }
        .remember-text { color: #4a5568; font-size: 14px; font-weight: 500; }

        button { width: 100%; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #2b6cb0; }
        .link { display: block; text-align: center; margin-top: 20px; color: #4a5568; text-decoration: none; font-size: 14px; }
        .link span { color: #3182ce; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <div id="email-error" class="error-msg"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <div id="password-error" class="error-msg"></div>
            </div>

            <label class="remember-container">
                <input type="checkbox" id="rememberMe">
                <span class="remember-text">تذكرني على هذا الجهاز</span>
            </label>
            
            <div id="general-error" class="error-msg" style="text-align: center; margin-bottom: 10px;"></div>
            
            <button type="submit">دخول</button>
        </form>
        <a href="index2.html" class="link">ليس لديك حساب بالفعل؟ <span>إنشاء حساب جديد</span></a>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('rememberMe');

        // كود فحص التذكر التلقائي عند فتح الصفحة مباشرة
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('remembered_email');
            const savedPassword = localStorage.getItem('remembered_password');
            if (savedEmail && savedPassword) {
                emailInput.value = savedEmail;
                passwordInput.value = savedPassword;
                rememberCheckbox.checked = true;
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // إخفاء الأخطاء القديمة
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // تشغيل ميزة "ذكرني" أو مسحها بناءً على اختيار المستخدم
                    if (rememberCheckbox.checked) {
                        localStorage.setItem('remembered_email', email);
                        localStorage.setItem('remembered_password', password);
                    } else {
                        localStorage.removeItem('remembered_email');
                        localStorage.removeItem('remembered_password');
                    }

                    alert('تم تسجيل الدخول بنجاح! جاري توجيهك لصفحة التحكم...');
                    window.location.href = 'C1.html';
                } else {
                    // إظهار الخطأ الدقيق تحت المدخل الخاطئ لوحده
                    if (data.target && data.target !== 'general') {
                        const errorDiv = document.getElementById(`${data.target}-error`);
                        if (errorDiv) {
                            errorDiv.innerText = data.message;
                            errorDiv.style.display = 'block';
                        }
                    } else {
                        const genError = document.getElementById('general-error');
                        genError.innerText = data.message;
                        genError.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const genError = document.getElementById('general-error');
                genError.innerText = 'حدث خطأ في الاتصال بالسيرفر الحالي.';
                genError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
