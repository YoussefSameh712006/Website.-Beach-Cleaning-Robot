<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 380px; border: 1px solid #e1e4e8; }
        h2 { text-align: center; color: #2d3748; margin-bottom: 25px; font-weight: 600; }
        
        /* تنسيق عام للمدخلات ورسائل الأخطاء السفلى */
        .input-group { margin-bottom: 15px; position: relative; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; transition: 0.2s; font-size: 14px; margin: 0; }
        input:focus { border-color: #3182ce; outline: none; }
        
        /* تصميم الرسائل الحمراء الاحترافية تحت الخانة مباشرة */
        .error-msg { color: #e53e3e; font-size: 12px; margin-top: 5px; display: none; font-weight: 500; padding-right: 5px; }
        
        button { width: 100%; padding: 12px; background-color: #3182ce; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #2b6cb0; }
        .link { display: block; text-align: center; margin-top: 20px; color: #4a5568; text-decoration: none; font-size: 14px; }
        .link span { color: #3182ce; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>إنشاء حساب جديد</h2>
        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم" required>
            </div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <div id="email-error" class="error-msg"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة السر" required>
                <div id="password-error" class="error-msg"></div>
            </div>
            
            <div class="input-group">
                <input type="tel" id="phone" placeholder="رقم التليفون">
            </div>
            
            <div class="input-group">
                <input type="text" id="serial" placeholder="سيريال الجهاز">
                <div id="serial-error" class="error-msg"></div>
            </div>
            
            <div id="general-error" class="error-msg" style="text-align: center; margin-bottom: 10px;"></div>
            
            <button type="submit">تسجيل الحساب</button>
        </form>
        <a href="login.html" class="link">لديك حساب بالفعل؟ <span>تسجيل الدخول</span></a>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // إخفاء أي رسائل خطأ قديمة قبل الفحص الجديد
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const serial = document.getElementById('serial').value;

            try {
                // استخدام المسار المباشر ليعمل محلياً وأونلاين على السيرفر بنجاح
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, phone, serial })
                });

                const data = await response.json();

                if (data.success) {
                    alert('تم إنشاء الحساب بنجاح! جاري تحويلك لصفحة تسجيل الدخول...');
                    window.location.href = 'login.html';
                } else {
                    // إظهار الخطأ الأحمر تحت الخانة المحددة المكررة بالظبط
                    if (data.target && data.target !== 'general') {
                        const errorDiv = document.getElementById(`${data.target}-error`);
                        if (errorDiv) {
                            errorDiv.innerText = data.message;
                            errorDiv.style.display = 'block';
                        }
                    } else {
                        const genError = document.getElementById('general-error');
                        genError.innerText = data.message;
                        genError.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                const genError = document.getElementById('general-error');
                genError.innerText = 'حدث خطأ في الاتصال بالسيرفر الحالي.';
                genError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
